<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Dino Dash</title>
<style>
  * { box-sizing: border-box; }
  body { margin:0; min-height:100vh; display:grid; place-items:center; background:#f3f5f7; font-family:system-ui, sans-serif; color:#27313a; }
  .game-wrap { width:min(94vw, 850px); }
  h1 { margin:0 0 6px; font-size:clamp(24px,5vw,34px); }
  p { margin:0 0 14px; color:#5d6872; }
  canvas { width:100%; height:auto; display:block; border:2px solid #27313a; border-radius:12px; background:#fff; touch-action:manipulation; }
  .controls { display:flex; gap:10px; margin-top:12px; align-items:center; flex-wrap:wrap; }
  button { border:0; border-radius:10px; padding:12px 18px; background:#27313a; color:white; font-weight:700; font-size:16px; cursor:pointer; }
  .hint { font-size:13px; color:#66717b; }
</style>
</head>
<body>
<div class="game-wrap">
  <h1>🦖 Dino Dash</h1>
  <p>Lompatin kaktusnya. Tenang, nggak ada burung terbang yang ganggu 😎</p>
  <canvas id="game" width="850" height="300" aria-label="Game Dino Dash"></canvas>
  <div class="controls">
    <button id="jump">LOMPAT ⬆</button>
    <button id="restart">ULANG ↻</button>
    <span class="hint">Kontrol: Space / ↑ / tap layar untuk lompat.</span>
  </div>
</div>
<script>
(() => {
  const canvas = document.getElementById('game');
  const ctx = canvas.getContext('2d');
  const jumpBtn = document.getElementById('jump');
  const restartBtn = document.getElementById('restart');
  const groundY = 244;
  let dino, obstacles, score, speed, frame, gameOver, started, lastTime;

  function reset() {
    dino = { x: 72, y: groundY - 46, w: 34, h: 46, vy: 0, grounded: true };
    obstacles = [];
    score = 0;
    speed = 5;
    frame = 0;
    gameOver = false;
    started = false;
    lastTime = 0;
    draw();
  }

  function jump() {
    if (gameOver) { reset(); started = true; dino.vy = -12.5; dino.grounded = false; return; }
    started = true;
    if (dino.grounded) {
      dino.vy = -12.5;
      dino.grounded = false;
    }
  }

  function cactus(x) {
    const h = 28 + Math.random() * 22;
    const w = 18 + Math.random() * 9;
    return { x, y: groundY - h, w, h };
  }

  function drawDino() {
    // Pixel-ish dinosaur, drawn from simple shapes
    ctx.fillStyle = '#27313a';
    ctx.fillRect(dino.x + 7, dino.y + 12, 22, 25);
    ctx.fillRect(dino.x + 17, dino.y + 2, 20, 18);
    ctx.fillRect(dino.x + 29, dino.y + 8, 12, 7);
    ctx.fillRect(dino.x + 2, dino.y + 18, 9, 7);
    ctx.fillStyle = '#fff';
    ctx.fillRect(dino.x + 29, dino.y + 6, 4, 4);
    ctx.fillStyle = '#27313a';
    const leg = dino.grounded && started && !gameOver && Math.floor(frame / 6) % 2 === 0;
    ctx.fillRect(dino.x + 10, dino.y + 35, 7, leg ? 11 : 8);
    ctx.fillRect(dino.x + 23, dino.y + 35, 7, leg ? 8 : 11);
  }

  function drawCactus(o) {
    ctx.fillStyle = '#2d8b57';
    ctx.fillRect(o.x + o.w * .35, o.y, o.w * .32, o.h);
    ctx.fillRect(o.x, o.y + o.h * .38, o.w * .38, 6);
    ctx.fillRect(o.x, o.y + o.h * .23, 6, o.h * .2);
    ctx.fillRect(o.x + o.w * .62, o.y + o.h * .52, o.w * .38, 6);
    ctx.fillRect(o.x + o.w - 6, o.y + o.h * .34, 6, o.h * .22);
  }

  function draw() {
    ctx.clearRect(0, 0, canvas.width, canvas.height);
    ctx.fillStyle = '#fff';
    ctx.fillRect(0, 0, canvas.width, canvas.height);
    // soft clouds, purely decorative
    ctx.fillStyle = '#edf1f3';
    ctx.beginPath(); ctx.arc(190, 70, 14, 0, Math.PI*2); ctx.arc(207, 65, 19, 0, Math.PI*2); ctx.arc(226, 71, 13, 0, Math.PI*2); ctx.fill();
    ctx.beginPath(); ctx.arc(590, 92, 11, 0, Math.PI*2); ctx.arc(606, 86, 16, 0, Math.PI*2); ctx.arc(623, 92, 11, 0, Math.PI*2); ctx.fill();
    ctx.strokeStyle = '#27313a'; ctx.lineWidth = 2;
    ctx.beginPath(); ctx.moveTo(0, groundY); ctx.lineTo(canvas.width, groundY); ctx.stroke();
    ctx.fillStyle = '#aab4bc';
    for (let i=0;i<12;i++) ctx.fillRect(((i*83 - (frame*speed*.7)%83)+850)%850, groundY+13, 18, 2);
    obstacles.forEach(drawCactus);
    drawDino();
    ctx.fillStyle = '#27313a';
    ctx.font = 'bold 18px system-ui';
    ctx.textAlign = 'right';
    ctx.fillText('SKOR ' + Math.floor(score), 820, 32);
    if (!started && !gameOver) {
      ctx.textAlign = 'center';
      ctx.font = 'bold 21px system-ui';
      ctx.fillText('TEKAN SPACE ATAU TAP UNTUK MULAI', 425, 145);
      ctx.font = '14px system-ui';
      ctx.fillText('Hindari semua kaktus!', 425, 170);
    }
    if (gameOver) {
      ctx.fillStyle = 'rgba(255,255,255,.82)';
      ctx.fillRect(0,0,850,300);
      ctx.textAlign = 'center';
      ctx.fillStyle = '#27313a';
      ctx.font = 'bold 32px system-ui';
      ctx.fillText('GAME OVER 💥', 425, 128);
      ctx.font = '18px system-ui';
      ctx.fillText('Skor akhir: ' + Math.floor(score), 425, 160);
      ctx.font = '15px system-ui';
      ctx.fillText('Tekan LOMPAT atau ULANG buat coba lagi', 425, 190);
    }
  }

  function update(dt) {
    if (!started || gameOver) return;
    frame += dt / 16.67;
    score += dt * 0.012;
    speed = Math.min(10, 5 + score / 180);
    dino.vy += 0.65 * (dt / 16.67);
    dino.y += dino.vy * (dt / 16.67);
    if (dino.y >= groundY - dino.h) {
      dino.y = groundY - dino.h;
      dino.vy = 0;
      dino.grounded = true;
    }
    if (obstacles.length === 0 || obstacles[obstacles.length-1].x < 850 - (230 + Math.random()*130)) {
      obstacles.push(cactus(870));
    }
    obstacles.forEach(o => o.x -= speed * (dt / 16.67));
    obstacles = obstacles.filter(o => o.x + o.w > -5);
    for (const o of obstacles) {
      const pad = 5;
      if (dino.x + dino.w - pad > o.x && dino.x + pad < o.x + o.w &&
          dino.y + dino.h - 4 > o.y && dino.y + 5 < o.y + o.h) {
        gameOver = true;
        break;
      }
    }
  }

  function loop(t) {
    const dt = lastTime ? Math.min(34, t - lastTime) : 16.67;
    lastTime = t;
    update(dt);
    draw();
    requestAnimationFrame(loop);
  }

  document.addEventListener('keydown', e => {
    if (e.code === 'Space' || e.code === 'ArrowUp') { e.preventDefault(); jump(); }
  });
  canvas.addEventListener('pointerdown', jump);
  jumpBtn.addEventListener('click', jump);
  restartBtn.addEventListener('click', reset);
  reset();
  requestAnimationFrame(loop);
})();
</script>
</body>
</html>
